version: "3.8"
services:
  db:
    image: postgres
    container_name: spring_pg
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spring_db
    ports:
      - "5450:5432"

  redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - "6379:6379"